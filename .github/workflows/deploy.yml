name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to almagest.andrewrausch.com on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions",
# and the custom domain in the same place.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let one in flight finish.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true # the sound engines
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Play a guided progression in Chromium
        env:
          ALMAGEST_URL: http://127.0.0.1:4173/
        run: |
          npm run preview > /tmp/almagest-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 "$ALMAGEST_URL" -o /dev/null
          node tools/verify/star-guide.cjs
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
